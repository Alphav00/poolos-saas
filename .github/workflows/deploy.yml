name: Deploy
# Deploys the Worker to poolos.pathofphi.com when main changes.
# Needs the repository secret CLOUDFLARE_API_TOKEN (see docs/DEPLOY.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 6434b48ad9cb48899c80a75c8804bade
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build the web app and Measure
        # The brand pack the live site wears (brands/README.md).
        env:
          BRAND: ccs-pools,sm-pools,blue-devil-pools
        run: pnpm build
      - name: Apply database migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply poolos --remote
      - name: Deploy the Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
      - name: Check it is up and behind Access
        # A new custom domain can take a few seconds to resolve, so retry.
        # 302: Access sends visitors to sign in (ready).
        # 403 with "cf-mitigated: challenge": Cloudflare's Bot Fight Mode challenged
        #      this runner (a datacenter address) before Access saw it, so Access
        #      cannot be checked from here (docs/DEPLOY.md). Any other 403 still fails.
        run: |
          hdr=$(mktemp)
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -D "$hdr" -w '%{http_code}' https://poolos.pathofphi.com/ || true)
            echo "attempt $i: home without sign-in: $code (expect 302 to the Access login)"
            [ "$code" = "302" ] && exit 0
            if [ "$code" = "403" ] && grep -qi '^cf-mitigated: *challenge' "$hdr"; then
              echo "::warning::Cloudflare Bot Fight Mode challenged this runner, so Access could not be checked from CI. The deploy itself succeeded (docs/DEPLOY.md)."
              exit 0
            fi
            sleep 5
          done
          exit 1

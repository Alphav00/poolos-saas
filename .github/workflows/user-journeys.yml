name: User journeys
# Drives the phone app in Chromium against a real Worker running locally
# (wrangler dev --local, local D1, a throwaway Access key). No Cloudflare
# secrets: nothing here reaches production. See docs/TESTING.md.
on:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-journeys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for playwright-core
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Run the user journeys
        run: pnpm e2e
        env:
          # Unbranded pack: the screenshots are uploaded as an artifact, so no
          # company name or logo goes in them (DESIGN.md §3 #1).
          BRAND: poolos
      - name: Summary
        if: always()
        run: test -f e2e-output/report.md && cat e2e-output/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report was written." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: user-journeys
          path: e2e-output/
          if-no-files-found: warn
          retention-days: 14

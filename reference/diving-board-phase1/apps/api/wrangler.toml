name = "diving-board-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "diving-board"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "diving-board-files"

[vars]
ENVIRONMENT = "development"
# Cloudflare Access team domain, e.g. "yourteam.cloudflareaccess.com".
# Set ACCESS_AUD with `wrangler secret put ACCESS_AUD`.
ACCESS_TEAM_DOMAIN = ""
